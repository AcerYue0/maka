name: Resolve PR 3853

on:
  push:
    branches:
      - backup/feat-zh-tw-locale-before-conflict-resolution

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print exact merge conflict hunks
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/apache/maka.git 2>/dev/null || git remote set-url upstream https://github.com/apache/maka.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin feat/zh-tw-locale
          git checkout -B resolve-pr-3853 origin/feat/zh-tw-locale

          set +e
          git merge --no-ff upstream/main -m "Merge apache/main into feat/zh-tw-locale"
          status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            echo 'No conflicts.'
            exit 0
          fi

          echo '=== CONFLICT PATHS ==='
          git diff --name-only --diff-filter=U
          echo '=== CONFLICT HUNKS ==='
          while IFS= read -r file; do
            echo
            echo "===== ${file} ====="
            git checkout --conflict=merge -- "${file}" 2>/dev/null || true
            python - "${file}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if not path.exists():
              print('[deleted in working tree]')
              raise SystemExit
          lines = path.read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(lines) if line.startswith('<<<<<<<')]
          if not markers:
              print('[no text conflict markers; showing staged variants below]')
          else:
              shown = set()
              for marker in markers:
                  start = max(0, marker - 12)
                  end = min(len(lines), marker + 45)
                  for i in range(start, end):
                      if i not in shown:
                          print(f'{i+1:5}: {lines[i]}')
                          shown.add(i)
                  print('-----')
          PY
            echo '--- stage 2 (feature/ours), first 260 lines ---'
            git show ":2:${file}" 2>/dev/null | sed -n '1,260p' || true
            echo '--- stage 3 (upstream/theirs), first 260 lines ---'
            git show ":3:${file}" 2>/dev/null | sed -n '1,260p' || true
          done < <(git diff --name-only --diff-filter=U)

          exit 1
