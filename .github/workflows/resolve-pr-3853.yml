name: Resolve PR 3853

on:
  push:
    branches:
      - backup/feat-zh-tw-locale-before-conflict-resolution

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Rebase i18n change onto latest upstream main
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/apache/maka.git 2>/dev/null || git remote set-url upstream https://github.com/apache/maka.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin feat/zh-tw-locale

          feature_sha="$(git rev-parse origin/feat/zh-tw-locale)"
          base_sha="$(git rev-parse upstream/main)"
          echo "feature_sha=${feature_sha}"
          echo "base_sha=${base_sha}"

          git checkout --detach "${base_sha}"
          if ! git cherry-pick -Xtheirs "${feature_sha}"; then
            conflict_path='apps/desktop/src/renderer/features/workbar/tools/tasks/use-session-tasks.ts'
            replacement_path='apps/desktop/src/renderer/features/workbar/tools/tasks/use-session-todo.ts'
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "${conflicts}" != "${conflict_path}" ]]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "${conflicts}"
              exit 2
            fi

            git rm "${conflict_path}"
            python <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/renderer/features/workbar/tools/tasks/use-session-todo.ts')
          text = path.read_text()
          old_import = "import { generalizedErrorMessage, generalizedErrorMessageChinese } from '@maka/core/redaction';"
          new_import = "import { generalizedErrorMessageForLocale } from '@maka/core/redaction';"
          old_error = """          error:\n            copy.locale === 'zh'\n              ? generalizedErrorMessageChinese(error, copy.loadFailed)\n              : generalizedErrorMessage(error, copy.loadFailed),"""
          new_error = """          error: generalizedErrorMessageForLocale(error, copy.loadFailed, copy.locale),"""
          if old_import not in text or old_error not in text:
              raise SystemExit('Expected upstream todo locale fallback was not found')
          path.write_text(text.replace(old_import, new_import).replace(old_error, new_error))
          PY
            git add "${replacement_path}"
            GIT_EDITOR=true git cherry-pick --continue
          fi

          git diff --check "${base_sha}"...HEAD
          npm ci
          npm run typecheck
          npm run format:check

          resolved_sha="$(git rev-parse HEAD)"
          echo "resolved_sha=${resolved_sha}"
          git push --force-with-lease=refs/heads/feat/zh-tw-locale:"${feature_sha}" origin HEAD:refs/heads/feat/zh-tw-locale
